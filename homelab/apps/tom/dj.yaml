---
apiVersion: v1
kind: Namespace
metadata:
  name: dj
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dj
  namespace: dj
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: dj/bot-token
    - secretKey: INTERNAL_SECRET
      remoteRef:
        key: dj/internal-secret
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: dj/tunnel-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dj-data
  namespace: dj
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dj
  namespace: dj
  labels:
    app: dj
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dj
  template:
    metadata:
      labels:
        app: dj
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: dj
          image: ghcr.io/dloez/enbraile-dj-bot:main-20261107163517-885556c # {"$imagepolicy": "flux-system:dj"}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: 'https://dj-api.enbraile.vip'
            - name: DATA_PATH
              value: '/data/dj.db'
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dj
                  key: DISCORD_BOT_TOKEN
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: dj
                  key: INTERNAL_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dj-data
---
apiVersion: v1
kind: Service
metadata:
  name: dj
  namespace: dj
spec:
  selector:
    app: dj
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: dj
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.10.7
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dj
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
