apiVersion: v1
kind: Namespace
metadata:
  name: dj
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dj
  namespace: dj
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: dj/bot-token
    - secretKey: INTERNAL_SECRET
      remoteRef:
        key: dj/internal-secret
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: dj/ts-authkey
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dj-data
  namespace: dj
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dj
  namespace: dj
  labels:
    app: dj
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dj
  template:
    metadata:
      labels:
        app: dj
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: dj
          image: ghcr.io/dloez/enbraile-dj-bot:main-20261108175848-e711a77 # {"$imagepolicy": "flux-system:dj"}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: 'https://dj.tailc952d1.ts.net'
            - name: DATA_PATH
              value: '/data/dj.db'
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dj
                  key: DISCORD_BOT_TOKEN
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: dj
                  key: INTERNAL_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dj-data
---
apiVersion: v1
kind: Service
metadata:
  name: dj
  namespace: dj
spec:
  selector:
    app: dj
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: dj
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale
  namespace: dj
rules:
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create']
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: ['tailscale-state']
    verbs: ['get', 'update', 'patch']
  - apiGroups: ['']
    resources: ['events']
    verbs: ['create', 'patch', 'get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale
  namespace: dj
subjects:
  - kind: ServiceAccount
    name: tailscale
    namespace: dj
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-serve
  namespace: dj
data:
  serve.json: |
    {
      "TCP": { "443": { "HTTPS": true } },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://dj.dj.svc.cluster.local:8080" } }
        }
      },
      "AllowFunnel": { "${TS_CERT_DOMAIN}:443": true }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
  namespace: dj
  labels:
    app: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      serviceAccountName: tailscale
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscale
          image: docker.io/tailscale/tailscale:v1.104.4
          env:
            - name: TS_HOSTNAME
              value: 'dj'
            - name: TS_USERSPACE
              value: 'true'
            - name: TS_KUBE_SECRET
              value: 'tailscale-state'
            - name: TS_SERVE_CONFIG
              value: '/config/serve.json'
            - name: TS_AUTH_ONCE
              value: 'true'
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: dj
                  key: TS_AUTHKEY
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: serve
              mountPath: /config
              readOnly: true
      volumes:
        - name: serve
          configMap:
            name: tailscale-serve
