---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-restarter
  namespace: gnosis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: beacon-restarter
  namespace: gnosis
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - lighthouse-beacon
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: beacon-restarter
  namespace: gnosis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: beacon-restarter
subjects:
  - kind: ServiceAccount
    name: beacon-restarter
    namespace: gnosis
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lighthouse-beacon-restart
  namespace: gnosis
spec:
  schedule: '0 */4 * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: beacon-restarter
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.2
              args:
                - 'rollout'
                - 'restart'
                - 'deployment/lighthouse-beacon'
                - '--namespace'
                - 'gnosis'
              resources:
                requests:
                  memory: '32Mi'
                  cpu: '10m'
                limits:
                  memory: '128Mi'
